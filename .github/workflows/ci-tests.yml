name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: partspile
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.5'

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test ./...
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/partspile?sslmode=disable
        JWT_SECRET: 'test-jwt-secret-key-for-ci-minimum-32-chars-long'
        DB_ENCRYPTION_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
        DB_HASH_PEPPER: 'AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE='
        SHARE_SECRET: 'AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI='
        LOCAL_DEVELOPMENT: 'true'
