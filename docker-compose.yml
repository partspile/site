services:
  redis:
    image: redis:7-alpine
    container_name: partspile-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg18
    container_name: partspile-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: partspile
    ports:
      - "5432:5432"
    volumes:
      - partspile_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.minio
    image: partspile-minio:dev
    container_name: partspile-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER: "on"
      MINIO_SERVER_URL: http://127.0.0.1:9000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - partspile_minio_data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo >/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 5s
      retries: 5

  jump-server:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.jump-server
    image: partspile-jump-server:dev
    container_name: partspile-jump-server
    ports:
      - "8000:10000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/partspile?sslmode=disable
      REDIS_URL: redis://redis:6379
      DB_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_HASH_PEPPER: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      MINIO_API_URL: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET_NAME: partspile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backups:/workspace/backups

  ollama:
    image: ollama/ollama:latest
    container_name: partspile-ollama
    ports:
      - "11434:11434"
    volumes:
      - partspile_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull nomic-embed-text"]
    restart: "no"

volumes:
  partspile_pgdata:
  partspile_minio_data:
  partspile_ollama:
