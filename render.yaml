version: "1"
projects:
- name: Parts Pile
  environments:
  - name: Production
    networking:
      isolation: enabled
    services:
    - type: web
      name: site
      runtime: image
      image:
        url: docker.io/partspile/site:latest
      plan: starter
      envVars:
      - fromGroup: BASE
      - fromGroup: JWT
      - fromGroup: TWILIO
      - fromGroup: MINIO
      - fromGroup: LLMs
      - fromGroup: TURNSTILE
      region: oregon
      healthCheckPath: /health
      domains:
      - parts-pile.com
      - www.parts-pile.com
      autoDeployTrigger: commit
    - type: keyvalue
      name: redis
      plan: starter
      region: oregon
      maxmemoryPolicy: noeviction
      ipAllowList: [] # internal network only (rate-limit keys include phone E.164)
    - type: web
      name: minio
      runtime: image
      image:
        url: cgr.dev/chainguard/minio:latest
      plan: starter
      envVars:
      - fromGroup: MINIO
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "9000"
      - key: MINIO_BROWSER
        value: "off"
      region: oregon
      healthCheckPath: /minio/health/live
      # ENTRYPOINT is /usr/bin/minio; this overrides CMD only.
      dockerCommand: server /data --address $HOST:$PORT
      disk:
        name: disk
        mountPath: /data
        sizeGB: 10
      autoDeployTrigger: commit
    - type: pserv
      name: ollama
      runtime: image
      image:
        url: docker.io/partspile/ollama:latest
      plan: starter
      envVars:
      - key: OLLAMA_HOST
        value: 0.0.0.0:11434
      - key: OLLAMA_KEEP_ALIVE
        value: "-1"
      region: oregon
      autoDeployTrigger: commit
    - type: web
      name: jump-server
      runtime: image
      image:
        url: docker.io/partspile/jump-server:latest
      plan: starter
      envVars:
      - fromGroup: BASE
      - fromGroup: MINIO
      region: oregon
      disk:
        name: disk
        mountPath: /data
        sizeGB: 2
      autoDeployTrigger: commit
    databases:
    - name: partspile-db
      databaseName: partspile_db
      user: partspile_db_user
      plan: basic-1gb
      region: oregon
      ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
      postgresMajorVersion: "18"
      diskSizeGB: 5
